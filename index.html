<html>
    <head>
        <title> Attic </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                background-color:black;
            }
            #attic{
                position: absolute;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 1;
                left: 50%;
                transform: translateX(-50%);
                /* border-radius: 15px 50px 30px 5px; */
                z-index: -1;
                
            }
            #table{
                position: absolute;
                bottom: 0;
                right: 0;
                width: 100%;
                height: 20%;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 0;
            }

            #paper{
                position: absolute;
                bottom: 15vh;
                width: 12vw;
                max-width: 150px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 3;
                right: 15vw;
            }
            #paper2{
                position: absolute;
                bottom: 15vh;
                width: 12vw;
                max-width: 150px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 3;
                right: 30vw;
            }
            #paper:hover{
                right: 100px;
            }
            #paper2:hover{
                right: 500px;
            }
            #computer{
                position:fixed;
                top: 310px;
                right: 740px;
                width: 300px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 0;
            }
            #computer:hover{
                width:350px;
            }
            #window{
                position:fixed;
                top: 18%;
                right: 41%;
                width: 180px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 0;
            }
            #window:hover{
                width:210px;
                top: 15%;
                right: 39%
            }
            #clock{
                position:fixed;
                top: 20%;
                right: 26%;
                width: 100px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 0;
                transition: all 0.5s ease-in;
            }
            #clock:hover{
                width:130px;
                top: 17%;
                right: 25%
                
            }
            #portrait{
                position:fixed;
                top: 30%;
                right: 60%;
                width: 70px;
                opacity: 1;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 0;
                transition: all 0.2s ease-in;
            }
            #portrait:hover{
                width:100px;
                top: 27%;
                right: 58%
                
            }
            #pencil{
                position:fixed;
                top: 430px;
                right: 220px;
                width: 150px;
                opacity: 2;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 2;
            }
            #pen{
                position:fixed;
                top: 450px;
                right: 400px;
                width: 100px;
                opacity: 2;
                /* border-radius: 15px 50px 30px 5px; */
                z-index: 2;
            }

            /* Add media queries for different screen sizes */
            @media screen and (max-width: 768px) {
                #attic {
                    right: 10vw;
                    width: 80vw;
                }
                
                #table {
                    width: 100vw;
                }
                
                #computer {
                    width: 25vw;
                    right: 50vw;
                }
                
                #window, #clock, #portrait {
                    width: 15vw;
                }
            }

            @media screen and (max-width: 480px) {
                #paper, #paper2 {
                    width: 20vw;
                }
                
                #pencil, #pen {
                    width: 15vw;
                }
            }
        </style>
    </head>
    <body>
        <img id="attic" src="attic.png"> 
        <img id="table" src="table.jpg"> 
        <div class="interactive-items">
            <img id="paper" src="paper.png"> 
            <img id="paper2" src="paper.png"> 
            <a href="ball.html"><img id="computer" src="computer.png"></a> 
            <a href="info.html"><img id="portrait" src="portrait.jpg"></a> 
            <a href="sky.html"><img id="window" src="window.png"></a> 
            <a href="timeline.html"><img id="clock" src="clock.png"></a> 
            <a href="pencil.html"><img id="pencil" src="pencil.png"></a>  
            <a href="pen.html"><img id="pen" src="pngimg.com - pen_PNG7404.png"></a> 
        </div>
    </body>
</html>
